<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samar Rivals 2D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111827;font-family:Arial}canvas{width:100%;height:100%;display:block;background:linear-gradient(#78c7ff 0 60%,#66717d 60%)}#hud{position:fixed;top:10px;left:12px;color:white;font-weight:bold;text-shadow:2px 2px #000}#hpbox{width:210px;height:16px;border:2px solid white;border-radius:8px;background:#222}#hp{height:100%;width:100%;background:#28d45c;border-radius:6px}#info{position:fixed;top:10px;right:12px;color:#fff;text-align:right;text-shadow:2px 2px #000}#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#111c;color:#fff;padding:8px 12px;border-radius:10px;text-align:center}#end{display:none;position:fixed;inset:0;place-items:center;background:#0008;color:#fff;font-size:42px;font-weight:900;text-align:center}button{font-size:18px;padding:10px 18px;border:0;border-radius:8px}#touch{position:fixed;inset:0;pointer-events:none} .touchbtn{position:absolute;pointer-events:auto;border:2px solid #ffffff88;background:#111b;color:#fff;border-radius:50%;width:64px;height:64px;font-weight:800;font-size:14px;touch-action:none}#left{left:18px;bottom:24px;width:150px;height:80px;border-radius:45px;background:#1118;border:2px solid #fff6}#lbtn{left:18px;bottom:32px}#rbtn{left:92px;bottom:32px}#jump{right:110px;bottom:30px}#fire{right:28px;bottom:24px;width:82px;height:82px;background:#c22a}#slash{right:115px;bottom:112px}#throw{right:28px;bottom:122px}#weapons{position:absolute;right:18px;top:92px;display:flex;gap:6px;pointer-events:auto}.wb{border:1px solid #fff8;background:#111c;color:#fff;border-radius:8px;padding:7px 9px;font-weight:700;touch-action:none} @media(min-width:800px){#touch{opacity:.55}}''</style></head><body><canvas id="c"></canvas><div id="hud">SAMAR RIVALS 2D<div id="hpbox"><div id="hp"></div></div><span id="hptext">200 / 200</span></div><div id="info">COIN POUNDS: 1,250<br>WEAPON: <span id="w">ASSAULT RIFLE</span><br>SCORE: <span id="score">0</span></div><div id="help">A/D or ←/→ Move • Space Jump • Tap/click Shoot • Q Slash • 1–5 Weapons</div><div id="end"></div><div id="touch"><div id="left"></div><button class="touchbtn" id="lbtn">◀</button><button class="touchbtn" id="rbtn">▶</button><button class="touchbtn" id="jump">JUMP</button><button class="touchbtn" id="fire">FIRE</button><button class="touchbtn" id="slash">SLASH</button><button class="touchbtn" id="throw">THROW</button><div id="weapons"><button class="wb" data-w="1">AR</button><button class="wb" data-w="0">P</button><button class="wb" data-w="2">R</button><button class="wb" data-w="3">SG</button><button class="wb" data-w="4">SN</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d');let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
let p={x:180,y:0,vx:0,vy:0,hp:200,face:1,on:0},keys={},bullets=[],last=0,score=0,wi=1;const names=['PISTOL','ASSAULT RIFLE','RIFLE','SHOTGUN','SNIPER'],dmg=[30,18,40,14,100],cd=[350,100,450,750,1200];let es=[];function spawn(){es=[{x:W*.68,y:0,hp:120},{x:W*.84,y:0,hp:120}];es.forEach(e=>e.y=H*.6-52)}p.y=H*.6-52;spawn();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if('12345'.includes(e.key)){wi=+e.key-1;document.querySelector('#w').textContent=names[wi]}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.addEventListener('pointerdown',shoot);
function hold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=1});['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,e=>{e.preventDefault();keys[key]=0}))} hold('lbtn','a');hold('rbtn','d');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();keys[' ']=1;setTimeout(()=>keys[' ']=0,80)});document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});document.getElementById('slash').addEventListener('pointerdown',e=>{e.preventDefault();slash()});document.getElementById('throw').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});document.querySelectorAll('.wb').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();wi=+b.dataset.w;document.querySelector('#w').textContent=names[wi]}));
function shoot(){let t=performance.now();if(t-last<cd[wi])return;last=t;let n=wi===3?8:1;for(let i=0;i<n;i++){let a=(Math.random()-.5)*(wi===3?.35:.03);bullets.push({x:p.x+28,y:p.y+22,vx:12*p.face*Math.cos(a),vy:12*Math.sin(a),d:dmg[wi]})}}
function slash(){for(const e of es)if(Math.abs(e.x-p.x)<90)e.hp-=35}let prev=0,q=0;
function frame(t){let dt=Math.min(.033,(t-prev)/1000||0);prev=t;p.vx=0;if(keys.a||keys.arrowleft){p.vx=-5;p.face=-1}if(keys.d||keys.arrowright){p.vx=5;p.face=1}if((keys[' ']||keys.w)&&p.on){p.vy=-11;p.on=0}if(keys.q&&!q){slash()}q=keys.q;p.vy+=25*dt;p.x+=p.vx;p.y+=p.vy;if(p.y>=H*.6-52){p.y=H*.6-52;p.vy=0;p.on=1}p.x=Math.max(5,Math.min(W-45,p.x));
for(const b of bullets){b.x+=b.vx;b.y+=b.vy}bullets=bullets.filter(b=>b.x>-30&&b.x<W+30&&b.y>0&&b.y<H);for(const b of bullets)for(const e of es)if(e.hp>0&&Math.abs(b.x-e.x)<30&&Math.abs(b.y-e.y)<55){e.hp-=b.d;b.x=-999}es=es.filter(e=>{if(e.hp<=0){score++;return false}if(Math.abs(e.x-p.x)<55&&Math.random()<.012)p.hp=Math.max(0,p.hp-20);return true});document.querySelector('#hp').style.width=(p.hp/2)+'%';document.querySelector('#hptext').textContent=p.hp+' / 200';document.querySelector('#score').textContent=score;draw();if(!es.length){end('VICTORY!')}else if(!p.hp){end('DEFEATED')}else requestAnimationFrame(frame)}
function end(s){let z=document.querySelector('#end');z.innerHTML=s+'<br><button onclick="location.reload()">PLAY AGAIN</button>';z.style.display='grid'}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#68747f';g.fillRect(0,H*.6,W,H*.4);g.fillStyle='#303844';g.fillRect(0,H*.75,W,8);for(let i=0;i<7;i++){g.fillStyle=i%2?'#b5bcc4':'#8f98a2';g.fillRect(i*190,H*.45,135,H*.15)}for(const e of es){g.fillStyle='#e43b3b';g.fillRect(e.x,e.y,34,52);g.fillStyle='#222';g.fillRect(e.x-5,e.y-12,44,6);g.fillStyle='#45df62';g.fillRect(e.x-5,e.y-12,44*Math.max(0,e.hp/120),6)}g.save();g.translate(p.x+17,p.y+26);g.scale(p.face,1);g.fillStyle='#17202c';g.fillRect(-17,-26,34,52);g.fillStyle='#e8c49c';g.beginPath();g.arc(0,-35,12,0,7);g.fill();g.fillStyle='#20242a';g.fillRect(10,-7,35,7);g.restore();g.fillStyle='#ffd43b';for(const b of bullets)g.fillRect(b.x,b.y,8,3)}requestAnimationFrame(frame);
</script></body></html>
